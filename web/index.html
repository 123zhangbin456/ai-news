<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 日报</title>

<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI 日报">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<header class="header">
  <div class="header-row">
    <h1 class="brand">AI 日报</h1>
    <div class="header-actions">
      <select id="date-select" class="date-select" aria-label="选择日期"></select>
      <button id="refresh" class="icon-btn" aria-label="刷新">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M20 11A8 8 0 1 0 18 16.5"/><path d="M20 5v6h-6"/>
        </svg>
      </button>
    </div>
  </div>
  <nav id="tabs" class="tabs" aria-label="分类"></nav>
</header>

<main id="list" class="list" aria-live="polite"></main>

<footer id="footer" class="footer"></footer>

<script src="app.js"></script>
</body>
</html>
