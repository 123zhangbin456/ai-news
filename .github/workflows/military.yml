name: 军事新闻流水线

# 与 AI 共用并发组，避免同时改 data/ 冲突。
# 时段略错开：整点偏后 10 分钟，减少撞车。
on:
  schedule:
    - cron: '10 22 * * *'            # 北京 06:10  晨报窗口
    - cron: '40 22 * * *'            # 北京 06:40
    - cron: '10,40 23 * * *'         # 北京 07:10 / 07:40
    - cron: '10,40 0-12 * * *'       # 北京 08:10 – 20:40
    - cron: '10 13,15,17,19,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式
        type: choice
        default: auto
        options: [auto, daytime, night, morning]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-news-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: 抓取、分类、推送（军事）
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node pipeline/run.js --topic=military --mode=${{ inputs.mode || 'auto' }}

      - name: 提交数据变更
        run: |
          git config user.name  'ai-news-bot'
          git config user.email 'ai-news-bot@users.noreply.github.com'
          git add data
          if git diff --staged --quiet; then
            echo '本轮无数据变化，跳过提交'
            exit 0
          fi
          git commit -m "data(military): $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: 组装站点
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp data/catalog.json _site/data/ 2>/dev/null || true
          cp data/index.json _site/data/ 2>/dev/null || true
          cp data/20*.json   _site/data/ 2>/dev/null || true
          for d in policy military; do
            if [ -d "data/$d" ]; then
              mkdir -p "_site/data/$d"
              cp -r "data/$d/." "_site/data/$d/"
            fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
