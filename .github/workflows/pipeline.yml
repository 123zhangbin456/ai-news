name: AI 新闻流水线

# cron 一律是 UTC，北京时间 = UTC + 8。
# 具体推不推、推什么由 run.js 按北京时间自行判断（auto 模式），
# 所以这里只负责"在该醒的时候唤醒它"，不用把时段逻辑抄两遍。
on:
  schedule:
    - cron: '0 22 * * *'             # 北京 06:00  晨报
    - cron: '30 22 * * *'            # 北京 06:30
    - cron: '0,30 23 * * *'          # 北京 07:00 / 07:30
    - cron: '*/30 0-12 * * *'        # 北京 08:00 – 20:30，每 30 分钟
    - cron: '0 13,15,17,19,21 * * *' # 北京 21:00 / 23:00 / 01:00 / 03:00 / 05:00，静默入库
  workflow_dispatch:
    inputs:
      mode:
        description: 运行模式
        type: choice
        default: auto
        options: [auto, daytime, night, morning]

permissions:
  contents: write
  pages: write
  id-token: write

# 半小时一跑，偶尔会撞上上一轮还没结束。排队而不是取消，
# 取消会让那一轮已抓取但未提交的数据丢失。
concurrency:
  group: ai-news-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 抓取、分类、推送
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: node pipeline/run.js --mode=${{ inputs.mode || 'auto' }}

      - name: 提交数据变更
        run: |
          git config user.name  'ai-news-bot'
          git config user.email 'ai-news-bot@users.noreply.github.com'
          git add data
          if git diff --staged --quiet; then
            echo '本轮无数据变化，跳过提交'
            exit 0
          fi
          git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 并发运行可能让远端已经前进了，重试几次而不是直接失败
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo '数据提交失败'
          exit 1

      - name: 组装站点
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          # 只发布前端要读的文件。seen.json / http-cache.json 是流水线内部状态，
          # 体积大且没有展示价值，不进站点
          cp data/index.json _site/data/ 2>/dev/null || true
          cp data/20*.json   _site/data/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
