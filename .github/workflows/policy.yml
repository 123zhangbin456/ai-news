name: 政策索引（农民工）

# 稳妥低频：每天北京时间 09:00 / 18:00 各一次。
# 只读中国政府网官方 RSS + 关键词过滤，不抓正文、不解读。
on:
  schedule:
    - cron: '0 1 * * *'   # 北京 09:00
    - cron: '0 10 * * *'  # 北京 18:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-news-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: 抓取公开政策索引并推送
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: node pipeline/run-policy.js

      - name: 提交数据变更
        run: |
          git config user.name  'ai-news-bot'
          git config user.email 'ai-news-bot@users.noreply.github.com'
          git add data
          if git diff --staged --quiet; then
            echo '本轮无数据变化，跳过提交'
            exit 0
          fi
          git commit -m "data(policy): $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: 组装站点
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp data/catalog.json _site/data/ 2>/dev/null || true
          cp data/index.json _site/data/ 2>/dev/null || true
          cp data/20*.json   _site/data/ 2>/dev/null || true
          if [ -d data/policy ]; then
            mkdir -p _site/data/policy
            cp -r data/policy/. _site/data/policy/
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
